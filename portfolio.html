<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technical Credentials Portfolio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#0a0f1d',
              card: '#111827',
              border: '#1f2937',
              accent: '#0ea5e9',
              accentHover: '#0284c7',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Aspect ratio locking helper */
    .aspect-video-locked {
      aspect-ratio: 16 / 10;
    }
    /* Simple Pulse Animation for fallback skeletons */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
    .animate-pulse-subtle {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-cyber-bg text-gray-100 font-sans min-height-screen antialiased selection:bg-cyber-accent selection:text-black">

  <div class="max-w-6xl mx-auto px-4 py-8 md:py-16">
    <!-- ============ PROFILE HEADER ============ -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-b border-cyber-border pb-10 mb-10">
      <div class="flex items-center gap-5">
        <!-- Minimalist Avatar Placeholder -->
        <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-cyber-accent to-purple-600 flex items-center justify-center text-cyber-bg font-extrabold text-2xl shadow-lg shadow-cyber-accent/15 select-none">
          DEV
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            Alex Carter
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50" title="Active"></span>
          </h1>
          <p class="text-cyber-textMuted text-sm mt-1 max-w-md leading-relaxed">
            Systems Architect & Security Engineer. Specializing in cloud infrastructure, embedded microcontrollers, and defensive security.
          </p>
        </div>
      </div>
      
      <!-- Social Link Icons (Minimum 44x44px touch targets) -->
      <div class="flex items-center gap-2">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="w-11 h-11 flex items-center justify-center rounded-lg bg-cyber-card hover:bg-gray-800 border border-cyber-border transition-colors text-gray-300 hover:text-white" aria-label="GitHub">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        </a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="w-11 h-11 flex items-center justify-center rounded-lg bg-cyber-card hover:bg-gray-800 border border-cyber-border transition-colors text-gray-300 hover:text-white" aria-label="LinkedIn">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd"/></svg>
        </a>
        <a href="https://notion.so" target="_blank" rel="noopener noreferrer" class="w-11 h-11 flex items-center justify-center rounded-lg bg-cyber-card hover:bg-gray-800 border border-cyber-border transition-colors text-gray-300 hover:text-white" aria-label="Notion">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M4.195 2.28a1.325 1.325 0 011.085-.568h13.25c.448 0 .86.223 1.107.597l2.122 3.208a1.319 1.319 0 01.196.69v13.626c0 .736-.596 1.332-1.332 1.332H3.332C2.596 21.166 2 20.57 2 19.834V6.208c0-.256.074-.508.214-.72l1.98-3.208zM19.123 7.83H4.82v11.547h14.303V7.83zm-2.316 2.308c.41 0 .742.333.742.743v5.291c0 .41-.332.742-.742.742h-3.308c-.41 0-.742-.332-.742-.742v-5.291c0-.41.332-.743.742-.743h3.308zm-7.616 0c.41 0 .742.333.742.743v5.291c0 .41-.332.742-.742.742H5.883c-.41 0-.742-.332-.742-.742v-5.291c0-.41.332-.743.742-.743h3.308z"/></svg>
        </a>
      </div>
    </header>

    <!-- ============ CONTROL PANEL (SEARCH & FILTER) ============ -->
    <div class="flex flex-col lg:flex-row justify-between gap-6 mb-8">
      <!-- Search Input -->
      <div class="relative flex-grow max-w-xl">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input 
          type="text" 
          id="searchBar" 
          placeholder="Search certificate title or technical tags..." 
          class="w-full pl-11 pr-4 py-3 bg-cyber-card border border-cyber-border rounded-xl text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyber-accent focus:ring-1 focus:ring-cyber-accent transition-all text-sm"
        >
      </div>

      <!-- Filter Pill Buttons (Minimum 44px height/touch target) -->
      <div class="flex flex-wrap items-center gap-2" id="filterContainer">
        <button data-filter="all" class="filter-btn h-11 px-5 rounded-xl text-xs font-semibold tracking-wider uppercase border border-cyber-border bg-cyber-accent text-cyber-bg border-cyber-accent transition-all select-none">
          All
        </button>
        <button data-filter="security" class="filter-btn h-11 px-5 rounded-xl text-xs font-semibold tracking-wider uppercase border border-cyber-border bg-cyber-card hover:bg-gray-800 text-gray-400 hover:text-white transition-all select-none">
          Security & CTF
        </button>
        <button data-filter="development" class="filter-btn h-11 px-5 rounded-xl text-xs font-semibold tracking-wider uppercase border border-cyber-border bg-cyber-card hover:bg-gray-800 text-gray-400 hover:text-white transition-all select-none">
          Development
        </button>
        <button data-filter="hardware" class="filter-btn h-11 px-5 rounded-xl text-xs font-semibold tracking-wider uppercase border border-cyber-border bg-cyber-card hover:bg-gray-800 text-gray-400 hover:text-white transition-all select-none">
          Hardware & Robotics
        </button>
      </div>
    </div>

    <!-- ============ CERTIFICATE GRID ============ -->
    <div id="portfolioGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Grid Items populated dynamically -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 text-gray-500 border border-dashed border-cyber-border rounded-2xl">
      <div class="text-3xl mb-3">🔍</div>
      <p class="text-sm font-medium">No credentials match your filter criteria.</p>
    </div>
  </div>

  <script>
    // ============ DATA STRUCTURE ============
    // Easily add, remove, or modify certificates here
    const certificates = [
      {
        id: "1",
        title: "Offensive Security Certified Professional (OSCP)",
        issuer: "Offensive Security",
        date: "Nov 2025",
        category: "security",
        image: "https://images.unsplash.com/photo-1563986768609-322da13575f3?w=600&auto=format&fit=crop&q=80",
        tags: ["Penetration Testing", "Active Directory", "Exploitation", "Linux"],
        verifyUrl: "https://www.credly.com"
      },
      {
        id: "2",
        title: "AWS Certified Solutions Architect – Professional",
        issuer: "Amazon Web Services",
        date: "Aug 2025",
        category: "development",
        image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&auto=format&fit=crop&q=80",
        tags: ["AWS", "Cloud Architecture", "Terraform", "Serverless"],
        verifyUrl: "https://www.credly.com"
      },
      {
        id: "3",
        title: "Embedded Systems & IoT Engineering Specialist",
        issuer: "Global Tech Institute",
        date: "May 2025",
        category: "hardware",
        image: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80",
        tags: ["C++", "RTOS", "ESP32", "MQTT", "Hardware"],
        verifyUrl: "https://example.com"
      },
      {
        id: "4",
        title: "Red Team Operator (CRTO)",
        issuer: "Zero Point Security",
        date: "Jan 2025",
        category: "security",
        image: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&auto=format&fit=crop&q=80",
        tags: ["Cobalt Strike", "Active Directory", "Red Teaming", "Evasion"],
        verifyUrl: "https://example.com"
      },
      {
        id: "5",
        title: "Full Stack Software Engineering Diploma",
        issuer: "Dev Academy",
        date: "Oct 2024",
        category: "development",
        image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&auto=format&fit=crop&q=80",
        tags: ["React", "TypeScript", "NodeJS", "PostgreSQL", "Docker"],
        verifyUrl: "https://example.com"
      },
      {
        id: "6",
        title: "Micro-Robotics & Circuit Design Certification",
        issuer: "RoboTech Labs",
        date: "Jul 2024",
        category: "hardware",
        image: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600&auto=format&fit=crop&q=80",
        tags: ["STM32", "Altium Designer", "Robotics", "PID Control"],
        verifyUrl: "https://example.com"
      }
    ];

    // ============ RENDER ENGINE ============
    let activeFilter = 'all';
    let searchQuery = '';

    function renderCertificates() {
      const grid = document.getElementById('portfolioGrid');
      const emptyState = document.getElementById('emptyState');
      
      // Filter list based on search and category tab
      const filtered = certificates.filter(cert => {
        const matchesCategory = activeFilter === 'all' || cert.category === activeFilter;
        const searchLower = searchQuery.toLowerCase();
        const matchesSearch = cert.title.toLowerCase().includes(searchLower) || 
                              cert.issuer.toLowerCase().includes(searchLower) ||
                              cert.tags.some(tag => tag.toLowerCase().includes(searchLower));
        
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      grid.classList.remove('hidden');
      emptyState.classList.add('hidden');

      grid.innerHTML = filtered.map(cert => {
        // Map tags into HTML elements
        const tagsHtml = cert.tags.map(tag => 
          `<span class="bg-gray-800 text-gray-300 font-mono text-[10px] tracking-wider uppercase font-semibold px-2 py-0.5 rounded">${tag}</span>`
        ).join('');

        return `
          <article class="bg-cyber-card border border-cyber-border rounded-2xl overflow-hidden flex flex-col group hover:border-cyber-accent/40 transition-all duration-200">
            <!-- Image Area with skeleton loading animation -->
            <div class="relative w-full aspect-video-locked bg-gray-900 overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-br from-gray-800 to-gray-950 animate-pulse-subtle z-0"></div>
              <img 
                src="${cert.image}" 
                alt="${cert.title}" 
                loading="lazy"
                class="absolute inset-0 w-full h-full object-cover z-10 opacity-0 transition-opacity duration-300"
                onload="this.classList.remove('opacity-0'); this.previousElementSibling.classList.add('hidden');"
                onerror="this.src='https://images.unsplash.com/photo-1544383835-bda2bc66a55d?w=600&auto=format&fit=crop&q=80'"
              >
            </div>

            <!-- Content Area -->
            <div class="p-5 flex flex-col flex-grow justify-between gap-5">
              <div class="space-y-2">
                <h3 class="text-white text-base font-bold leading-snug group-hover:text-cyber-accent transition-colors">
                  ${cert.title}
                </h3>
                <div class="flex flex-col text-xs text-cyber-textMuted space-y-0.5">
                  <span class="font-medium text-gray-300">${cert.issuer}</span>
                  <span class="text-[11px] font-mono text-gray-500">${cert.date}</span>
                </div>
              </div>

              <!-- Tech tags and external links -->
              <div class="space-y-4">
                <div class="flex flex-wrap gap-1.5">
                  ${tagsHtml}
                </div>
                
                <a 
                  href="${cert.verifyUrl}" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  class="flex items-center justify-between w-full h-11 px-4 text-xs font-semibold tracking-wider text-cyber-accent hover:text-white bg-cyber-accent/5 hover:bg-cyber-accent/10 border border-cyber-accent/20 hover:border-cyber-accent rounded-xl transition-all duration-200"
                >
                  VERIFY CREDENTIAL
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                  </svg>
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // ============ INTERACTION HANDLERS ============
    function init() {
      // Input search controller
      const search = document.getElementById('searchBar');
      search.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderCertificates();
      });

      // Filter category pills controller
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // Update active layout state
          filterBtns.forEach(b => {
            b.classList.remove('bg-cyber-accent', 'text-cyber-bg', 'border-cyber-accent');
            b.classList.add('bg-cyber-card', 'hover:bg-gray-800', 'text-gray-400', 'hover:text-white');
          });
          btn.classList.add('bg-cyber-accent', 'text-cyber-bg', 'border-cyber-accent');
          btn.classList.remove('bg-cyber-card', 'hover:bg-gray-800', 'text-gray-400', 'hover:text-white');

          activeFilter = btn.getAttribute('data-filter');
          renderCertificates();
        });
      });

      // Render default list
      renderCertificates();
    }

    window.onload = init;
  </script>

</body>
</html>
